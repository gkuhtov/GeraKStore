name: Завершить ребрендинг URL Store

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Обновить URL GeraKStore
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("repo.json")
          text = path.read_text(encoding="utf-8")
          text = text.replace("https://github.com/gkuhtov/GeraStore", "https://github.com/gkuhtov/GeraKStore")
          text = text.replace("https://gkuhtov.github.io/GeraStore", "https://gkuhtov.github.io/GeraKStore")
          text = text.replace('"sourceName": "GeraStore"', '"sourceName": "GeraKStore"')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Сохранить изменения
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Завершить ребрендинг Store"
          git push

      - name: Удалить одноразовый workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/rebrand-urls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rebrand-urls.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Удалить одноразовый workflow ребрендинга"
          git push
