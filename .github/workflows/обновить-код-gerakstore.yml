name: Обновить код GeraKStore

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить внутренние названия
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip = {'.git', '.github'}
          text_ext = {'.md', '.txt', '.json', '.js', '.jsx', '.ts', '.tsx', '.html', '.css', '.scss', '.py', '.sh', '.yml', '.yaml', '.plist', '.xml', '.strings', '.h', '.m', '.mm', '.swift', '.pbxproj', '.entitlements'}

          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              if p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              original = s
              # Сохраняем технические идентификаторы совместимости.
              protected = {
                  'com.gkuhtov.gerastore': '__GERAKSTORE_PROTECTED_BUNDLE__'
              }
              for old, marker in protected.items():
                  s = s.replace(old, marker)

              s = s.replace('GeraStore', 'GeraKStore')
              s = s.replace('gerastore', 'gerakstore')

              for old, marker in protected.items():
                  s = s.replace(marker, old)

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print('Изменены файлы:')
          for p in changed:
              print(p)
          PY

      - name: Зафиксировать изменения
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Обновить внутренние названия GeraKStore"
          git push
