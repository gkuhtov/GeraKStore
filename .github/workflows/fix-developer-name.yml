name: Fix developer names

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace developer names
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("repo.json")
          text = path.read_text(encoding="utf-8")
          old = text
          text = text.replace('"developerName": "GK"', '"developerName": "ГЕРЫЧ"')
          if text == old:
              print("No changes needed")
          else:
              path.write_text(text, encoding="utf-8")
              print("Replaced GK -> ГЕРЫЧ")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- repo.json; then
            echo "No repo.json changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Set all app developers to ГЕРЫЧ"
          git push
